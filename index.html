<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finnys Vokabeltrainer</title>
<meta name="theme-color" content="#3563e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f3f6fc; --card:#fff; --ink:#1d2742; --muted:#5f6b85; --line:#dfe5f2;
  --pri:#3563e9; --pri-ink:#fff; --pri-soft:#e6ecfd;
  --good:#16875a; --good-soft:#dff5ea; --bad:#c93a2e; --bad-soft:#fde6e3; --warn:#8a6100; --warn-soft:#fff2cc;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121829; --card:#1b2340; --ink:#eaf0ff; --muted:#a3aed0; --line:#2b3560;
    --pri:#6c8cff; --pri-ink:#0d1330; --pri-soft:#26315e;
    --good:#4cd39b; --good-soft:#173d31; --bad:#ff8b7f; --bad-soft:#4a2320; --warn:#ffd166; --warn-soft:#45391a; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);min-height:100vh}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:.4em 0} .muted{color:var(--muted)} code{background:var(--pri-soft);padding:1px 6px;border-radius:6px;font-size:.92em}
.top{max-width:820px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:1.35rem;margin:0}
nav{display:flex;gap:6px}
nav button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:8px 12px;border-radius:12px;cursor:pointer;min-height:44px}
nav button.on{background:var(--pri-soft);color:var(--pri)}
body.practice nav{display:none}
main{max-width:820px;margin:0 auto;padding:12px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.center{justify-content:center}
.btn{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 16px;min-height:48px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.ghost{background:transparent}
.btn.big{font-size:1.25rem;padding:14px 26px;min-height:56px}
.btn.small{min-height:40px;padding:6px 12px;font-size:.95rem}
.btn[disabled]{opacity:.5}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .btn{flex:1 1 130px}
.seg .btn.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mode{display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;min-height:76px}
.mode b{font-size:1.05rem}.mode span{font-size:.88rem;color:var(--muted)}
.mode.on{border-color:var(--pri);background:var(--pri-soft)}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.lcard{position:relative;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:var(--card)}
.lcard.on{border-color:var(--pri);background:var(--pri-soft)}
.lcard input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.lcard .emo{font-size:1.7rem;grid-row:span 2}
.lcard .lname{font-weight:700}.lcard .lmeta{font-size:.85rem;color:var(--muted)}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:.95rem}
.chip{display:inline-block;background:var(--pri-soft);color:var(--pri);font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:99px}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri);transition:width .3s}
.pmeta{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px;font-size:.9rem;color:var(--muted);gap:8px}
.plabel{color:var(--muted);margin:10px 0 2px}
.bigword{font-size:clamp(2rem,9vw,3.2rem);font-weight:800;text-align:center;margin:8px 0 14px;word-break:break-word}
.tr{text-align:center;color:var(--muted);margin-bottom:10px}
.hintline{text-align:center;font-size:1.6rem;letter-spacing:.12em;font-family:ui-monospace,Consolas,monospace;margin:0 0 10px}
form.ans{display:flex;gap:10px;margin:8px 0}
input.answer,input.field,select.field,textarea.field{font:inherit;font-size:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;min-height:48px;width:100%}
input.answer{font-size:1.5rem;font-weight:600;text-align:center}
input.answer:focus,.field:focus{outline:3px solid color-mix(in srgb,var(--pri) 45%,transparent);border-color:var(--pri)}
textarea.field{min-height:150px;font-family:ui-monospace,Consolas,monospace;font-size:15px}
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.key{font:inherit;font-size:1.15rem;font-weight:700;min-width:44px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;touch-action:manipulation}
.panel{border-radius:14px;padding:14px;margin:10px 0;text-align:center}
.panel.good{background:var(--good-soft);color:var(--good)}
.panel.bad{background:var(--bad-soft);color:var(--bad)}
.panel.warn{background:var(--warn-soft);color:var(--warn)}
.panel .solution{font-size:1.7rem;font-weight:800;color:var(--ink);margin:4px 0}
.mic{width:100%;font-size:1.3rem}
.mic.live{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.65}}
.end{float:right}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:1.7rem}.tile span{color:var(--muted);font-size:.88rem}
.chart{display:flex;gap:4px;align-items:flex-end;height:170px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .stack{display:flex;flex-direction:column;justify-content:flex-end;width:100%;height:120px}
.chart .stack i{display:block;width:100%}
.chart .stack .r{background:var(--good)}.chart .stack .a{background:#e0a100}.chart .stack .w{background:var(--bad)}
.chart .tot{font-size:.75rem;color:var(--muted);height:1.2em}.chart .lab{font-size:.75rem;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:.95rem}
th{color:var(--muted);font-weight:600}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.fields label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.95rem}
.sw{display:flex;align-items:center;gap:10px;margin:8px 0;min-height:44px}
.sw input{width:22px;height:22px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9;text-align:center}
#toast.show{opacity:1}
.stars{font-size:2.6rem;text-align:center}
@media (max-width:640px){
  .top{flex-direction:column;align-items:flex-start;padding-bottom:0}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  nav button{flex:1;padding:8px 4px;font-size:.85rem}
  main{padding-bottom:96px}
  body.practice main{padding-bottom:30px}
}
</style>
</head>
<body>
<header class="top">
  <h1>📚 Finnys Vokabeltrainer</h1>
  <nav aria-label="Hauptmenü">
    <button data-act="nav" data-v="home">🏠 Üben</button>
    <button data-act="nav" data-v="stats">📊 Statistik</button>
    <button data-act="nav" data-v="lists">📝 Listen</button>
    <button data-act="nav" data-v="settings">⚙️ Optionen</button>
  </nav>
</header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="vokabeln.js" charset="utf-8"></script>
<script>
'use strict';
/* ═════════════ Helfer ═════════════ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayNum = (d = new Date()) => Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
const dayKey = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

const LANGS = {
  fr: { name: 'Französisch', flag: '🇫🇷', art: 'le, la, l\', un, une', accents: ['é','è','ê','ë','à','â','ç','î','ï','ô','û','ù','œ'], sample: 'Bonjour, je m\'appelle Finny.' },
  en: { name: 'Englisch',    flag: '🇬🇧', art: 'the, a, an',            accents: [],                                                        sample: 'Hello, my name is Finny.' },
};
const NUMW = {
  fr: ['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf','vingt'],
  en: ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'],
};
const MODES = [
  { id: 'write',  icon: '✍️', name: 'Schreiben', desc: 'Deutsch lesen, Wort tippen' },
  { id: 'listen', icon: '👂', name: 'Hören',     desc: 'Wort hören, Wort tippen' },
  { id: 'speak',  icon: '🎤', name: 'Sprechen',  desc: 'Vorsprechen, nachsprechen' },
  { id: 'mix',    icon: '🎲', name: 'Gemischt',  desc: 'Alles ein bisschen' },
];

/* ═════════════ Speicher ═════════════ */
const LS_KEY = 'finny-vokabeltrainer-v1';
const defaultDB = () => ({ settings: { rate: 0.9, sound: true, size: 10, voices: {}, enVariant: 'en-GB' }, custom: [], words: {}, days: {} });
function loadDB() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const d = JSON.parse(raw), b = defaultDB(); return { ...b, ...d, settings: { ...b.settings, ...d.settings } }; }
  } catch (e) {}
  return defaultDB();
}
let DB = loadDB(), saveWarned = false;
function saveDB() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
  catch (e) { if (!saveWarned) { saveWarned = true; toast('Speichern nicht möglich – der Fortschritt geht beim Schließen verloren.'); } }
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3500);
}

/* ═════════════ Vokabeln ═════════════ */
const allLists = () => [...(window.VOKABELN || []), ...DB.custom];
function parseWord(entry, lang) {
  const alts = String(entry[0]).split('|').map(s => s.trim()).filter(Boolean);
  return { lang, f: alts[0], alts, d: entry[1], key: lang + '|' + alts[0].toLowerCase() };
}
function wordsOfList(l) { return l.words.map(e => parseWord(e, l.lang)); }
function lookupAll() { const m = new Map(); for (const l of allLists()) for (const w of wordsOfList(l)) m.set(w.key, w); return m; }

/* ═════════════ Prüfen ═════════════ */
const base = s => String(s).normalize('NFC').toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.,!?;:¡¿"«»()\-–]/g, ' ').replace(/\s+/g, ' ').trim();
const loose = s => base(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/œ/g, 'oe').replace(/æ/g, 'ae').replace(/ß/g, 'ss');
const ART = { fr: /^(?:(?:les|le|la|une|un|des|du|de la)\s+|l')\s*/, en: /^(?:the|an|a|to)\s+/ };
const noArt = (s, l) => s.replace(ART[l] || /^$/, '');
function lev(a, b) {
  const m = a.length, n = b.length; if (Math.abs(m - n) > 1) return 2;
  const dp = Array.from({ length: m + 1 }, (_, i) => { const r = new Array(n + 1).fill(0); r[0] = i; return r; });
  for (let j = 1; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return dp[m][n];
}
/** → {r:'ok'|'near'|'wrong'|'empty', hint?} */
function judge(ans, w) {
  const a = base(ans); if (!a) return { r: 'empty' };
  if (w.alts.some(v => a === base(v))) return { r: 'ok' };
  const la = loose(ans);
  if (w.alts.some(v => la === loose(v))) return { r: 'near', hint: 'Fast richtig! Achte auf die Akzente und Sonderzeichen.' };
  for (const v of w.alts) {
    const na = noArt(la, w.lang), nv = noArt(loose(v), w.lang);
    if (na && na === nv) return { r: 'near', hint: na !== la ? 'Fast! Der Artikel stimmt nicht.' : `Fast! Es fehlt noch der Artikel (${LANGS[w.lang].art}).` };
  }
  if (w.alts.some(v => { const t = loose(v); return t.length >= 4 && lev(la, t) === 1; }))
    return { r: 'near', hint: 'Ganz nah dran – ein Buchstabe stimmt nicht. Schau noch mal genau hin!' };
  return { r: 'wrong' };
}
function speechMatch(alt, w) {
  let a = alt.trim(); if (/^\d+$/.test(a) && NUMW[w.lang][+a]) a = NUMW[w.lang][+a];
  const la = loose(a);
  return w.alts.some(v => { const lv = loose(v); return la === lv || noArt(la, w.lang) === noArt(lv, w.lang); });
}
function hintPattern(f) { return [...f].map((c, i) => i === 0 ? c : (/[\s'’\-.,!?…]/.test(c) ? (c === ' ' ? ' ' : c) : '_')).join(' '); }

/* ═════════════ Sprachausgabe & -erkennung ═════════════ */
const HAS_TTS = 'speechSynthesis' in window;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let voices = [], curUtt = null;
const langCode = l => l === 'en' ? DB.settings.enVariant : 'fr-FR';
const vLang = v => v.lang.replace('_', '-').toLowerCase();
function refreshVoices() { if (HAS_TTS) voices = speechSynthesis.getVoices(); }
if (HAS_TTS) { refreshVoices(); speechSynthesis.onvoiceschanged = () => { refreshVoices(); if (S.view === 'settings' || S.view === 'home') render(); }; }
const voiceOptions = l => voices.filter(v => vLang(v).startsWith(langCode(l).slice(0, 2)));
const voiceMissing = l => HAS_TTS && voices.length > 0 && voiceOptions(l).length === 0;
function pickVoice(l) {
  const pref = DB.settings.voices[l];
  if (pref) { const v = voices.find(v => v.voiceURI === pref); if (v) return v; }
  const pool = voiceOptions(l), exact = pool.filter(v => vLang(v) === langCode(l).toLowerCase()), c = exact.length ? exact : pool;
  return c.find(v => /natural|online/i.test(v.name)) || c.find(v => /google|siri|premium|enhanced/i.test(v.name)) || c[0] || null;
}
function speak(text, lang, slow) {
  if (!HAS_TTS) return;
  try {
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); curUtt = u;
    u.lang = langCode(lang); const v = pickVoice(lang); if (v) u.voice = v;
    u.rate = slow ? 0.55 : DB.settings.rate;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function listenOnce(lang, onResult, onError) {
  const r = new SR(); let done = false;
  r.lang = langCode(lang); r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
  r.onresult = e => { if (done) return; done = true; onResult([...e.results[0]].map(x => x.transcript)); };
  r.onerror = e => { if (done) return; done = true; onError(e.error); };
  r.onend = () => { if (done) return; done = true; onError('no-speech'); };
  try { r.start(); } catch (e) { done = true; onError('start'); }
  return r;
}
const ASR_ERR = {
  'not-allowed': 'Das Mikrofon ist nicht erlaubt. Erlaube es in der Adressleiste / in den Browser-Einstellungen.',
  'service-not-allowed': 'Die Spracherkennung ist nicht erlaubt (auf dem iPad/iPhone: Einstellungen → Siri & Diktierfunktion aktivieren).',
  'no-speech': 'Ich habe nichts gehört. Versuch es noch mal – etwas lauter!',
  'audio-capture': 'Ich finde kein Mikrofon.',
  'network': 'Die Spracherkennung braucht Internet.',
};
let actx = null;
function tone(freqs, dur = 0.12) {
  if (!DB.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); let t = actx.currentTime;
    for (const f of freqs) {
      const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.15, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur); t += dur;
    }
  } catch (e) {}
}
const sfx = { ok: () => tone([660, 880]), bad: () => tone([220, 170], 0.18), near: () => tone([440], 0.1) };

/* ═════════════ Lernfortschritt (Leitner-Kästchen) ═════════════ */
const INTERVALS = [0, 1, 2, 4, 8, 16];   // Tage bis zur nächsten Wiederholung je Kästchen
const MASTERED = 3;
function record(w, res, kind) {
  const p = DB.words[w.key] || (DB.words[w.key] = { box: 0, due: 0, r: 0, a: 0, w: 0, sr: 0, sn: 0 });
  const dk = dayKey(), d = DB.days[dk] || (DB.days[dk] = { r: 0, a: 0, w: 0, sr: 0, sn: 0 });
  if (kind === 'speak') {
    p.sn++; d.sn++;
    if (res !== 'wrong') { p.sr++; d.sr++; }
    if (res === 'right') p.box = Math.min(5, p.box + 1);
  } else if (res === 'right') { p.r++; d.r++; p.box = Math.min(5, p.box + 1); }
  else if (res === 'assisted') { p.a++; d.a++; }
  else { p.w++; d.w++; p.box = 0; }
  p.due = dayNum() + INTERVALS[p.box];
  saveDB();
}
function buildQueue(listIds, size) {
  const map = new Map();
  for (const l of allLists()) if (listIds.includes(l.id)) for (const w of wordsOfList(l)) map.set(w.key, w);
  const today = dayNum();
  const arr = [...map.values()].map(w => { const p = DB.words[w.key]; return { w, box: p ? p.box : 0, due: p ? p.due : 0, j: Math.random() }; });
  const byPrio = (a, b) => a.box - b.box || a.j - b.j;
  const dueNow = arr.filter(x => x.due <= today).sort(byPrio), later = arr.filter(x => x.due > today).sort(byPrio);
  return shuffle([...dueNow, ...later].slice(0, size).map(x => x.w));
}

/* ═════════════ Zustand ═════════════ */
const S = { view: 'home', lang: 'fr', mode: 'mix', sel: {}, session: null, imp: { lang: 'fr', name: '', text: '', foreignFirst: true } };
const cur = () => S.session && S.session.queue[S.session.idx];

function pickKind() {
  if (S.mode !== 'mix') return S.mode;
  const r = Math.random();
  return r < 0.5 ? 'write' : (r < 0.75 || !SR || !HAS_TTS) ? 'listen' : 'speak';
}
const mkItem = (w, repeat = false, kind = null) => ({ w, kind: kind || pickKind(), repeat, phase: 'ask', tries: 0, hint: 0, ans: '', msg: null, play: true, meaning: false, listening: false, res: null });

function startSession() {
  const ids = [...(S.sel[S.lang] || [])];
  if (!ids.length) return toast('Wähle mindestens eine Liste aus.');
  const words = buildQueue(ids, DB.settings.size);
  if (!words.length) return toast('In den gewählten Listen sind keine Wörter.');
  S.session = { queue: words.map(w => mkItem(w)), idx: 0, res: { right: 0, assisted: 0, wrong: 0 }, missed: new Map(), requeued: new Set() };
  S.view = 'practice'; render();
}
function finish(it, res) {
  const s = S.session;
  if (!it.repeat) { record(it.w, res, it.kind); s.res[res]++; }
  it.res = res;
  if (res === 'wrong') {
    s.missed.set(it.w.key, it.w);
    if (!it.repeat && !s.requeued.has(it.w.key)) { s.requeued.add(it.w.key); s.queue.splice(Math.min(s.idx + 4, s.queue.length), 0, mkItem(it.w, true, it.kind)); }
    it.phase = it.kind === 'speak' ? 'fb' : 'copy'; sfx.bad();
  } else { it.phase = 'fb'; sfx.ok(); }
  if (it.kind !== 'speak' || res !== 'wrong') setTimeout(() => speak(it.w.f, it.w.lang), 350);
  render();
}
function next() {
  const s = S.session; s.idx++;
  if (HAS_TTS) speechSynthesis.cancel();
  if (s.idx >= s.queue.length) S.view = 'summary';
  render();
}
function endSession() { if (HAS_TTS) speechSynthesis.cancel(); try { activeRec && activeRec.abort(); } catch (e) {} S.session = null; S.view = 'home'; render(); }

function render() {

function keysHTML(w, copy) {

}

function streak() {
  const has = d => { const v = DB.days[dayKey(d)]; return v && (v.r + v.a + v.w + v.sn) > 0; };
  const d = new Date(); let n = 0; if (!has(d)) d.setDate(d.getDate() - 1);

  return n;
}

/* ── Listen einlesen ── */
const HEADER_RE = /^(franz|engl|deutsch|wort|vokabel|french|english|german|fremd)/i;
function parseVocab(text, foreignFirst) {
  const rows = [], bad = [];
  for (let line of text.replace(/^﻿/, '').split(/\r?\n/)) {
    line = line.trim(); if (!line || line.startsWith('#')) continue;
    let parts;
    if (line.includes('\t')) parts = line.split('\t');
    else if (line.includes(';')) parts = line.split(';');
    else if (/\s[-–—=]\s/.test(line)) parts = line.split(/\s[-–—=]\s/);
    else if (line.includes('=')) parts = line.split('=');
    else if (line.includes(',')) { const i = line.indexOf(','); parts = [line.slice(0, i), line.slice(i + 1)]; }
    else { bad.push(line); continue; }
    parts = parts.map(p => p.trim().replace(/^"|"$/g, '').trim());
    if (parts.length < 2 || !parts[0] || !parts[1]) { bad.push(line); continue; }
    if (HEADER_RE.test(parts[0]) && HEADER_RE.test(parts[1])) continue;
    rows.push(foreignFirst ? [parts[0], parts[1]] : [parts[1], parts[0]]);
  }
  return { rows, bad };
}
function previewHTML() {
  const im = S.imp; if (!im.text.trim()) return '<p class="muted">Noch nichts eingefügt.</p>';
  const { rows, bad } = parseVocab(im.text, im.foreignFirst);
  return `<p><b>${rows.length}</b> Wörter erkannt${bad.length ? `, <span style="color:var(--bad)">${bad.length} Zeile(n) nicht lesbar</span>` : ''}.</p>
    ${rows.length ? `<table>${rows.slice(0, 5).map(r => `<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join('')}</table>${rows.length > 5 ? `<p class="muted">… und ${rows.length - 5} weitere</p>` : ''}` : ''}
    ${bad.length ? `<details><summary>Nicht lesbare Zeilen</summary>${bad.slice(0, 10).map(b => `<div><code>${esc(b)}</code></div>`).join('')}</details>` : ''}`;
}

      <div style="display:flex;align-items:flex-end"><button class="btn" data-act="testVoice" data-lang="${l}">🔊 Testen</button></div></div>`).join('')}
    <div class="fields"><label>Englisch als<select class="field" data-change="enVariant"><option value="en-GB" ${st.enVariant === 'en-GB' ? 'selected' : ''}>Britisch (Schulenglisch)</option><option value="en-US" ${st.enVariant === 'en-US' ? 'selected' : ''}>Amerikanisch</option></select></label>
      <label>Sprechtempo: ${st.rate.toFixed(2)}<input type="range" min="0.6" max="1.1" step="0.05" value="${st.rate}" data-input="rate"></label></div>
    <label class="sw"><input type="checkbox" data-change="sound" ${st.sound ? 'checked' : ''}> Töne bei richtig / falsch</label>
    <p class="muted" style="font-size:.9rem">Fehlt eine Stimme? <b>Windows:</b> Einstellungen → Zeit &amp; Sprache → Sprache &amp; Region → Sprache hinzufügen (Französisch, mit Sprachausgabe); <b>Microsoft Edge</b> hat zusätzlich sehr gute Online-Stimmen („… Natural“). <b>iPad/iPhone:</b> Einstellungen → Bedienungshilfen → Gesprochene Inhalte → Stimmen. <b>Android:</b> Einstellungen → Sprachausgabe.</p>
    <p class="muted" style="font-size:.9rem">Spracherkennung (Finny spricht): ${SR ? '✅ verfügbar' : '❌ in diesem Browser nicht verfügbar (Chrome, Edge oder Safari nutzen)'}. Beim ersten Mal fragt der Browser nach dem Mikrofon – „Erlauben“ wählen.</p></div>
  <div class="card"><h2>Sicherung</h2>
    <p class="muted">Der Fortschritt liegt in diesem Browser auf diesem Gerät. Zum Umziehen auf ein anderes Gerät: hier speichern und dort laden.</p>
    <div class="row"><button class="btn" data-act="exportBackup">💾 Sicherung speichern</button>
      <label class="btn" style="cursor:pointer">📥 Sicherung laden<input type="file" hidden accept=".json,application/json" data-change="importBackup"></label>
      <button class="btn" data-act="resetProgress" style="color:var(--bad)">Fortschritt zurücksetzen</button></div></div>`;
}

/* ═════════════ Ereignisse ═════════════ */
const ACT = {
  nav: el => { if (HAS_TTS) speechSynthesis.cancel(); S.session = null; S.view = el.dataset.v; render(); },
  lang: el => { S.lang = el.dataset.v; render(); },
  mode: el => { S.mode = el.dataset.v; render(); },
  toggleList: el => { const s = S.sel[S.lang]; el.checked ? s.add(el.dataset.id) : s.delete(el.dataset.id); render(); },
  selAll: () => { S.sel[S.lang] = new Set(allLists().filter(l => l.lang === S.lang).map(l => l.id)); render(); },
  selNone: () => { S.sel[S.lang] = new Set(); render(); },
  start: () => startSession(),
  endSession: () => endSession(),
  next: () => next(),
  say: () => { const it = cur(); it && speak(it.w.f, it.w.lang); },
  slow: () => { const it = cur(); it && speak(it.w.f, it.w.lang, true); },
  sayw: el => speak(el.dataset.text, el.dataset.lang),
  meaning: () => { const it = cur(); it.ans = ($('#answer') || {}).value || ''; it.meaning = true; render(); },
  hint: () => { const it = cur(); it.ans = ($('#answer') || {}).value || ''; it.hint++; if (it.hint >= 2 && HAS_TTS) speak(it.w.f, it.w.lang); render(); },
  ins: el => { const i = $('#answer'); if (!i) return; const a = i.selectionStart ?? i.value.length, b = i.selectionEnd ?? a;
    i.value = i.value.slice(0, a) + el.dataset.ch + i.value.slice(b); i.focus(); i.setSelectionRange(a + 1, a + 1); },
  mic: () => {
    const it = cur(); if (it.listening) return;
    if (HAS_TTS) speechSynthesis.cancel();
    it.listening = true; it.msg = null; render();
    activeRec = listenOnce(it.w.lang, alts => {
      it.listening = false;
      if (alts.some(x => speechMatch(x, it.w))) finish(it, it.tries === 0 ? 'right' : 'assisted');
      else { it.tries++; it.msg = { t: 'bad', text: `Ich habe „${alts[0]}“ verstanden. Hör noch mal zu und versuch es nochmal!` }; sfx.bad(); render(); }
    }, err => { it.listening = false; it.msg = { t: 'warn', text: ASR_ERR[err] || 'Das hat nicht geklappt. Versuch es noch mal.' }; render(); });
  },
  skip: () => { const it = cur(); finish(it, 'wrong'); },
  selfok: () => finish(cur(), 'right'),
  selfno: () => finish(cur(), 'wrong'),
  impOrder: el => { S.imp.foreignFirst = el.dataset.v === '1'; render(); },
  saveImport: () => {
    const im = S.imp, { rows } = parseVocab(im.text, im.foreignFirst);
    if (!rows.length) return toast('Keine Vokabeln erkannt – bitte Text einfügen.');
    const l = { id: 'c' + Date.now(), lang: im.lang, emoji: '📝', name: im.name.trim() || 'Meine Liste', words: rows };
    DB.custom.push(l); saveDB(); (S.sel[im.lang] || (S.sel[im.lang] = new Set())).add(l.id);
    S.lang = im.lang; S.imp = { ...im, name: '', text: '' }; S.view = 'home'; render(); toast(`„${l.name}“ gespeichert (${rows.length} Wörter).`);
  },
  delCustom: el => { const l = DB.custom.find(x => x.id === el.dataset.id); if (l && confirm(`Liste „${l.name}“ wirklich löschen?`)) { DB.custom = DB.custom.filter(x => x !== l); saveDB(); render(); } },
  testVoice: el => speak(LANGS[el.dataset.lang].sample, el.dataset.lang),
  exportBackup: () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(DB)], { type: 'application/json' }));
    a.download = `vokabeltrainer-sicherung-${dayKey()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  resetProgress: () => { if (confirm('Wirklich den ganzen Lernfortschritt und die Statistik löschen?')) { DB.words = {}; DB.days = {}; saveDB(); render(); toast('Zurückgesetzt.'); } },
};
const FORM = {
  answer: () => submitAnswer(), copy: () => submitAnswer(),
};
function submitAnswer() {
  const it = cur(), val = ($('#answer') || {}).value || '', j = judge(val, it.w);
  if (j.r === 'empty') return;
  it.ans = val;
  if (it.phase === 'copy') {
    if (j.r === 'ok') { sfx.ok(); it.ans = ''; return next(); }
    it.copyFails = (it.copyFails || 0) + 1;
    it.msg = { t: 'warn', text: 'Noch nicht ganz – schreibe das Wort genau so ab. Sonderzeichen findest du in den Tasten unter dem Feld.' }; return render();
  }
  if (j.r === 'ok') finish(it, it.tries === 0 && !it.hint ? 'right' : 'assisted');
  else if (j.r === 'near' && it.tries === 0) { it.tries++; it.msg = { t: 'warn', text: j.hint }; sfx.near(); render(); }
  else { it.ans = ''; finish(it, 'wrong'); }
}
const CHG = {
  size: el => { DB.settings.size = +el.value; saveDB(); },
  sound: el => { DB.settings.sound = el.checked; saveDB(); },
  enVariant: el => { DB.settings.enVariant = el.value; delete DB.settings.voices.en; saveDB(); render(); },
  voice: el => { DB.settings.voices[el.dataset.lang] = el.value; saveDB(); },
  impLang: el => { S.imp.lang = el.value; },
  impFile: async el => {
    const f = el.files[0]; if (!f) return;
    const buf = await f.arrayBuffer(); let text;
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { text = new TextDecoder('windows-1252').decode(buf); }
    S.imp.text = text; if (!S.imp.name) S.imp.name = f.name.replace(/\.[^.]+$/, ''); render();
  },
  importBackup: async el => {
    const f = el.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (!d || typeof d.words !== 'object' || typeof d.days !== 'object') throw 0;
      if (!confirm('Die Sicherung ersetzt den Fortschritt auf diesem Gerät. Fortfahren?')) return;
      const b = defaultDB(); DB = { ...b, ...d, settings: { ...b.settings, ...d.settings } }; saveDB(); render(); toast('Sicherung geladen.');
    } catch (e) { toast('Diese Datei ist keine gültige Sicherung.'); }
  },
};
const INP = {
  impText: el => { S.imp.text = el.value; $('#impPreview').innerHTML = previewHTML(); },
  impName: el => { S.imp.name = el.value; },
  rate: el => { DB.settings.rate = +el.value; saveDB(); el.closest('label').firstChild.textContent = `Sprechtempo: ${(+el.value).toFixed(2)}`; },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e); });
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (f) { e.preventDefault(); FORM[f.dataset.form](f); } });
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el) CHG[el.dataset.change](el); });
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el) INP[el.dataset.input](el); });
document.addEventListener('mousedown', e => { if (e.target.closest('.key')) e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || S.view !== 'practice' || e.target.closest('button,input,textarea,select')) return;
  const it = cur(); if (it && it.phase === 'fb') { e.preventDefault(); next(); }
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
